[package]
name = "dicto-telemetry"
version = "0.1.0"
edition = "2024"
authors = ["Mohammadreza Khani"]
license = "AGPL-3.0-or-later"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1"
rand = "0.9"

[lib]
name = "dicto_telemetry"
path = "src/lib.rs"
